<div class="workspace" [class.compact]="compact" [class.drawer-open]="drawer" (keydown.escape)="closeDrawer()">
  <header class="workspace-header">
    <button #menuButton type="button" class="menu-toggle" aria-label="打开主菜单" aria-controls="workspace-navigation" [attr.aria-expanded]="drawer" (click)="drawer=!drawer"><mat-icon>menu</mat-icon></button>
    <strong>开诚智枢 SCADIA</strong><span class="page-title">{{title | translate}}</span>
    <span class="health" role="status">{{status}}</span>
    <span class="user">{{auth.getUser()?.username || '访客'}}</span>
    <button type="button" data-login (click)="login()">登录 / 切换账号</button>
    <button type="button" *ngIf="auth.getUser() && auth.getUser().username !== 'guest'" (click)="signout()">退出</button>
    <button type="button" aria-label="切换全屏" (click)="fullscreen()"><mat-icon>fullscreen</mat-icon></button>
  </header>
  <button class="backdrop" type="button" *ngIf="drawer" aria-label="关闭主菜单" (click)="closeDrawer()"></button>
  <nav id="workspace-navigation" class="workspace-nav" aria-label="平台主菜单">
    <button type="button" class="collapse-toggle" (click)="compact=!compact" [attr.aria-expanded]="!compact"><mat-icon>{{compact ? 'chevron_right' : 'chevron_left'}}</mat-icon><span>收起菜单</span></button>
    <section *ngFor="let group of groups">
      <button type="button" class="nav-group" [title]="group.text | translate" [attr.aria-expanded]="expanded.has(group.id)" (click)="toggle(group.id)"><mat-icon>{{group.icon}}</mat-icon><span>{{group.text | translate}}</span><mat-icon class="chevron">{{expanded.has(group.id) ? 'expand_less' : 'expand_more'}}</mat-icon></button>
      <div *ngIf="expanded.has(group.id)">
        <ng-container *ngFor="let item of group.children">
          <a *ngIf="canShow(item) && item.id !== 'n-analysis-window'" [routerLink]="href(item).split('?')[0]" [queryParams]="item.id==='n-models'?{config:'1'}:{}" [class.current]="active(item)" [attr.aria-current]="active(item)?'page':null" [title]="item.text | translate"><mat-icon>{{item.icon}}</mat-icon><span>{{item.text | translate}}</span></a>
          <a *ngIf="item.id === 'n-analysis-window'" href="/ai-analysis" target="scadia-ai-analysis" (click)="openAnalysis($event)" [title]="item.text | translate"><mat-icon>{{item.icon}}</mat-icon><span>{{item.text | translate}}</span></a>
        </ng-container>
      </div>
    </section>
  </nav>
  <main class="workspace-content"><ng-content></ng-content></main>
</div>
