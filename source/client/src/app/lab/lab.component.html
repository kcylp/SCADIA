<div [style.background-color]="backgroudColor" style="height: 100%">
    <app-scadia-view *ngIf="labView" class="lab-body" id="lab" [view]="currentView" [hmi]="hmi" [gaugesManager]="gaugesManager"></app-scadia-view>
    <div *ngIf="!labView">
        {{'lab.loading' | translate}}
    </div>
    <template #messagecontainer>
    </template>
    <button mat-mini-fab color="warn" class="fab-btn" (click)="onTest()">{{'lab.test' | translate}}</button>
    <app-tester #tester></app-tester>
</div>
