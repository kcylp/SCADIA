# 测试后端：一条命令起一个真引擎，用来把契约套件跑实（D8–D10）。
#
# 为什么放在这里：契约套件的价值在于**对真引擎**断言。本机没有 PostgreSQL 时，
# PostgreSQL 的适配器只能标 unproven；这条命令把它变成可证实的。
#
#   npm run test:backends:up      起
#   npm run test:contract         跑契约套件（会自动连上，不必改代码）
#   npm run test:backends:down    停并清掉数据
#
# 镜像选择说明：PostgreSQL 用 18-alpine，因为本机已有该镜像（省一次 400MB 拉取）；
# 换成任何现代 PostgreSQL 都不影响契约结论 —— 适配器只用到标准 SQL 与参数化查询。

services:
  postgres:
    image: postgres:18-alpine
    container_name: scadia-test-postgres
    environment:
      POSTGRES_USER: scadia
      POSTGRES_PASSWORD: scadia
      POSTGRES_DB: scadia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scadia -d scadia"]
      interval: 2s
      timeout: 3s
      retries: 30

  tdengine:
    image: tdengine/tdengine:3.3.6.0
    container_name: scadia-test-tdengine
    environment:
      TAOS_FQDN: localhost
    ports:
      - "6041:6041"
      - "6030:6030"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6041/-/ping || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
