<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCADIA AI 分析</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#182235;--line:#334155;--text:#e5edf7;--muted:#94a3b8;--accent:#49a3ff;--warn:#fbbf24;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#19385a 0,#111827 42%,#0b1220 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:1180px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:11px}.title{font-size:26px;font-weight:700;margin:4px 0}.sub{color:var(--muted);margin:0}.status{border:1px solid var(--line);border-radius:8px;padding:10px 13px;min-width:205px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:7px}.dot.ok{background:#34d399}.dot.bad{background:var(--bad)}.grid{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:18px}.panel{background:rgba(24,34,53,.92);border:1px solid var(--line);border-radius:8px;padding:18px}.panel h2{font-size:15px;margin:0 0 14px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{color:var(--muted);font-size:12px}select{width:100%;background:#0f172a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit}select:focus{outline:2px solid #357db7;outline-offset:1px}.evidence{margin-top:18px;color:var(--muted);font-size:12px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.btn{border:1px solid #3c6f9e;background:#1c4d79;color:#f2f8ff;padding:8px 12px;border-radius:6px;cursor:pointer}.btn:hover{background:#24699f}.btn.secondary{background:transparent;border-color:var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}textarea{width:100%;min-height:118px;resize:vertical;background:#0f172a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px;font:inherit}textarea:focus{outline:2px solid #357db7;outline-offset:1px}.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.message{color:var(--muted);min-height:22px}.answer{white-space:pre-wrap;margin-top:18px;border-top:1px solid var(--line);padding-top:16px;color:#dceaff}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fact{padding:10px;border:1px solid var(--line);border-radius:6px;background:#111b2c}.fact b{display:block;font-size:17px}.fact span{color:var(--muted);font-size:12px}.tag-list{max-height:180px;overflow:auto;margin-top:10px;display:grid;gap:4px}.tag{display:flex;gap:7px;align-items:center;font-size:12px}.tag input{accent-color:var(--accent)}.quality{margin-top:12px;padding:9px;border-left:3px solid var(--warn);background:#211d12;color:#f8d58a;font-size:12px}.quality.ok{border-color:#34d399;background:#10271f;color:#a7f3d0}@media(max-width:720px){.app{padding:15px}.top{display:block}.status{margin-top:14px}.grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}
input:not([type=checkbox]){width:100%;background:#102d48;color:#edf6ff;border:1px solid #658ba6;border-radius:6px;padding:9px;font:inherit}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #9edfff;outline-offset:2px}body{background:#102d48;--panel:#194567;--line:#487393;--text:#edf6ff;--muted:#c2d7e8;--accent:#9edfff}.panel{background:#194567}.embedded .eyebrow{display:none}.embedded .app{padding:16px}.top{flex-wrap:wrap}#config-message{overflow-wrap:anywhere}
</style></head>
<body><main class="app"><header class="top"><div><div class="eyebrow">SCADIA / AI ANALYSIS</div><h1 class="title">统一 AI 分析</h1><p class="sub">先选择明确分析目标，再使用当前账号可见的证据；分析结果不执行控制动作。</p></div><div class="status"><span id="dot" class="dot"></span><span id="status">正在检查模型配置...</span><div id="model" class="sub"></div></div></header>
<section class="grid"><aside class="panel"><h2>分析目标</h2><div class="field"><label for="module">模块</label><select id="module"></select></div><div class="field"><label for="intent">目标</label><select id="intent"></select></div><div class="field"><label for="window">时间窗</label><select id="window"><option value="3600000">过去 1 小时</option><option value="21600000">过去 6 小时</option><option value="86400000">过去 24 小时</option></select></div><div id="tags" class="tag-list"></div><div class="evidence" id="evidence">证据尚未读取</div><div id="quality" class="quality">尚未判定证据是否充分</div></aside><section class="panel"><div class="bar"><h2>向 SCADIA 提问</h2><button class="btn secondary" id="refresh">刷新证据</button></div><div id="facts" class="facts"></div><textarea id="question" maxlength="4000" placeholder="问题文本只能补充已选目标，例如：请区分事实、异常、需要补证和人工动作。"></textarea><div class="actions"><button class="btn" id="ask">开始分析</button><button class="btn secondary" id="test">测试 DeepSeek</button><span id="message" class="message" role="status" aria-live="polite"></span></div><div id="answer" class="answer" hidden></div></section></section></main>
<section id="model-config" class="app" hidden><form class="panel" id="config-form"><h2>模型服务配置（管理员）</h2><p class="sub">本地视觉复核仍使用现场模型；此处仅配置 DeepSeek 证据分析。密钥保存在本机工程目录，不回显。</p><div class="field"><label for="config-url">服务地址</label><input id="config-url" type="url" required value="https://api.deepseek.com" autocomplete="off"></div><div class="field"><label for="config-model">模型名称</label><input id="config-model" required value="deepseek-chat" maxlength="100"></div><div class="field"><label for="config-key">新密钥（留空保留现有密钥）</label><input id="config-key" type="password" autocomplete="new-password" maxlength="1024"><span id="config-key-state" class="sub"></span></div><label><input type="checkbox" id="config-clear">清除现有密钥</label><div class="actions"><button class="btn" id="config-save" type="submit">保存并回读</button><button class="btn secondary" id="config-test" type="button">测试连接</button><span role="status" id="config-message"></span></div></form></section>
<p class="app"><a href="/home" style="color:var(--accent)">返回 SCADIA（登录 / 重新登录）</a> · 登录后可在此点击“刷新证据”。</p>
<script>
const $=id=>document.getElementById(id);let modules=[],evidence=null,requestSeq=0,analysisBusy=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let recoveredSession=null,refreshing=null,restoreAttempted=false,sessionGeneration=0,sessionSignature=null;
const embedded=new URLSearchParams(location.search).has('embedded');
if(embedded){document.body.classList.add('embedded')}
function admin(){return [-1,255].includes(Number(session().user?.groups))}
function configVisibility(){const yes=admin();$('model-config').hidden=!yes;$('test').hidden=!yes;if(!yes){$('config-key').value='';$('config-clear').checked=false}}
async function loadConfig(){configVisibility();if(!admin())return;try{const c=await api('/api/analysis/config');$('config-url').value=c.baseUrl;$('config-model').value=c.model;$('config-key-state').textContent=c.keyConfigured?'密钥已配置（不回显）':'尚未配置密钥'}catch(e){$('config-message').textContent=e.message}}
$('config-form').onsubmit=async e=>{e.preventDefault();if(!admin())return;$('config-save').disabled=true;$('config-message').textContent='正在保存…';try{await api('/api/analysis/config',{method:'POST',body:JSON.stringify({baseUrl:$('config-url').value,model:$('config-model').value,apiKey:$('config-key').value,clearKey:$('config-clear').checked})});$('config-key').value='';$('config-clear').checked=false;await loadConfig();await status();$('config-message').textContent='已保存并回读；后续分析使用新配置'}catch(e){$('config-message').textContent=e.message}finally{$('config-save').disabled=false}};
$('config-test').onclick=async()=>{$('config-test').disabled=true;await ask(true);$('config-message').textContent=$('message').textContent;$('config-test').disabled=false};
function session(){try{if(window.parent!==window&&window.parent.location.origin===location.origin){return {token:window.parent.scadiaAccessToken||null,user:JSON.parse(window.parent.sessionStorage.getItem('currentUser')||'null'),linked:true}}}catch(_){}try{if(window.opener&&!window.opener.closed&&window.opener.location.origin===location.origin){return {token:window.opener.scadiaAccessToken||null,user:JSON.parse(window.opener.sessionStorage.getItem('currentUser')||'null'),linked:true}}}catch(_){}try{const user=JSON.parse(sessionStorage.getItem('currentUser')||'null');return {token:window.scadiaAccessToken||user?.token||(recoveredSession?.user?.username===user?.username?recoveredSession?.token:null),user}}catch(_){return {token:null,user:null}}}
function identity(){const s=session();return JSON.stringify([s.user?.username||null,s.user?.groups||null,s.user?.info||null])}
function checkSession(){const next=identity();if(sessionSignature!==null&&next!==sessionSignature){sessionGeneration++;requestSeq++;evidence=null;recoveredSession=null;$('tags').replaceChildren();$('facts').replaceChildren();$('answer').textContent='';$('answer').hidden=true;$('evidence').textContent='登录身份已变化';$('quality').textContent='请刷新证据后继续';setMessage('登录身份已变化，请刷新证据',true)}sessionSignature=next;configVisibility()}
async function restoreSession(force=false){const s=session();if(s.linked||(!force&&(s.token||restoreAttempted)))return;if(refreshing)return refreshing;restoreAttempted=true;refreshing=(async()=>{const r=await fetch('/api/refresh',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)return;const b=await r.json();if(b.data?.token){const {token,...user}=b.data;sessionStorage.setItem('currentUser',JSON.stringify(user));recoveredSession={token,user};checkSession()}})().catch(()=>{}).finally(()=>{refreshing=null});return refreshing}
function authHeaders(){const headers={'Content-Type':'application/json'},s=session();if(s.token) headers['x-access-token']=s.token;if(s.user?.username) headers['x-auth-user']=JSON.stringify({user:s.user.username,groups:s.user.groups});return headers}
async function api(path,opt){await restoreSession();checkSession();const generation=sessionGeneration;const run=()=>fetch(path,Object.assign({},opt,{headers:Object.assign(authHeaders(),opt?.headers||{}),signal:AbortSignal.timeout(30000)}));let r=await run();if(r.status===401&&!session().linked){await restoreSession(true);if(generation===sessionGeneration)r=await run()}let b={};try{b=await r.json()}catch(_){}checkSession();if(generation!==sessionGeneration)throw new Error('登录身份已变化，请刷新证据');if(!r.ok)throw new Error(r.status===401?'会话已过期，请返回 SCADIA 重新登录后刷新证据':r.status===403?'当前账号没有该模块的权限':b.message||('HTTP '+r.status));return b}
function targetKey(){return $('module').value+'|'+$('intent').value+'|'+$('window').value}
function module(){return modules.find(m=>m.id===$('module').value)}
function drawIntents(){const m=module();$('intent').innerHTML=(m?.intents||[]).map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');drawTags()}
function drawModules(){$('module').innerHTML=modules.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');drawIntents()}
function drawTags(){const m=module();const need=['current','history','bound_current'].includes((m?.intents||[]).find(i=>i.id===$('intent').value)?.requirement);$('tags').innerHTML=need&&evidence?.tags?.length?'<div class="sub">可选标签</div>'+evidence.tags.map(t=>`<label class="tag"><input type="checkbox" value="${esc(t.id)}" checked> ${esc(t.name)} (${esc(t.id)})</label>`).join(''):''}
function selectedTags(){return [...document.querySelectorAll('#tags input:checked')].map(x=>x.value)}
function setMessage(t,bad=false){$('message').textContent=t||'';$('message').style.color=bad?'var(--bad)':'var(--muted)'}
async function status(){try{const s=await api('/api/analysis/status');$('status').textContent=s.configured?'DeepSeek 已配置':'DeepSeek 未配置';$('model').textContent=s.model||'请在服务端设置 DEEPSEEK_API_KEY';$('dot').className='dot '+(s.configured?'ok':'')}catch(e){$('status').textContent='分析服务不可达';$('dot').className='dot bad';$('model').textContent=e.message}}
function renderEvidence(){const files=(evidence?.evidence||[]).filter(x=>x.kind==='video');const fresh=files.filter(x=>x.status==='fresh').length;$('facts').innerHTML=`<div class="fact"><b>${evidence?.tags?.length||0}</b><span>可见标签</span></div><div class="fact"><b>${evidence?.evidence?.filter(x=>x.kind==='alarms')[0]?.data?.length??'未读取'}</b><span>报警记录</span></div><div class="fact"><b>${fresh}/${files.length||0}</b><span>新鲜视频证据</span></div>`;$('evidence').textContent=evidence?.generatedAt?'证据时间：'+new Date(evidence.generatedAt).toLocaleString():'证据尚未读取';const q=evidence?.evidenceQuality;$('quality').textContent=q?.sufficient?'证据充分，可以提交分析':'证据不足：'+(q?.missing||[]).map(x=>x.message).join('；');$('quality').className='quality '+(q?.sufficient?'ok':'');drawTags()}
async function context(){const seq=++requestSeq,key=targetKey();evidence=null;$('tags').replaceChildren();$('facts').replaceChildren();$('answer').hidden=true;$('quality').textContent='正在核验证据';setMessage('正在读取证据...');try{const result=await api('/api/analysis/context',{method:'POST',body:JSON.stringify({module:$('module').value,intent:$('intent').value,tagIds:[],from:Date.now()-Number($('window').value),to:Date.now()})});if(seq!==requestSeq||key!==targetKey())return;evidence=result;renderEvidence();setMessage(evidence.status==='evidence_insufficient'?'证据不足，未请求模型':'证据已更新')}catch(e){if(seq===requestSeq)setMessage(e.message,true)}}
function setTargetLocked(locked){analysisBusy=locked;['module','intent','window','refresh'].forEach(id=>$(id).disabled=locked)}
async function ask(test=false){checkSession();const generation=sessionGeneration,key=targetKey(),q=test?'请报告模型连接状态，并严格说明没有提供的事实。':$('question').value.trim();if(!test&&!q){setMessage('请先输入问题',true);return}const body={module:test?'platform':$('module').value,intent:test?'runtime_status':$('intent').value,question:q,tagIds:test?[]:selectedTags(),from:Date.now()-Number($('window').value),to:Date.now()};$('ask').disabled=$('test').disabled=true;$('answer').hidden=true;setTargetLocked(true);setMessage('正在检查证据...');try{const r=await api(test?'/api/analysis/test':'/api/analysis/chat',{method:'POST',body:JSON.stringify(body)});if(generation!==sessionGeneration||key!==targetKey())return;if(r.status!=='ok'){setMessage(r.status+(r.evidenceQuality?.missing?.length?': '+r.evidenceQuality.missing.map(x=>x.message).join('；'):r.message?': '+r.message:''),true);return}$('answer').textContent=r.answer;$('answer').hidden=false;setMessage('分析完成，耗时 '+r.elapsedMs+' ms')}catch(e){if(generation===sessionGeneration&&key===targetKey())setMessage(e.message,true)}finally{$('ask').disabled=$('test').disabled=false;setTargetLocked(false)}}
$('module').onchange=()=>{drawIntents();context()};$('intent').onchange=context;$('window').onchange=context;$('refresh').onclick=async()=>{await status();if(!modules.length){try{modules=(await api('/api/analysis/modules')).modules||[];drawModules()}catch(e){setMessage(e.message,true);return}}await context()};$('ask').onclick=()=>ask(false);$('test').onclick=()=>ask(true);(async()=>{try{await restoreSession();checkSession();setInterval(checkSession,500);const m=await api('/api/analysis/modules');modules=m.modules||[];drawModules();await status();await context();await loadConfig();if(new URLSearchParams(location.search).has('config'))$('model-config').scrollIntoView()}catch(e){setMessage(e.message,true)}})();
</script></body></html>
