 function fit(){
   var W = 1920, TB = 87, NW = 150;
   var vw = (window.visualViewport && window.visualViewport.width)  || window.innerWidth;
   var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
   var s = vw / W;                       // uniform scale by width: nothing deforms
   var tb = TB * s, nw = NW * s;
   var $ = function(id){ return document.getElementById(id); };
   $('topbar').style.width = vw + 'px';
   $('topbar').style.height = tb + 'px';
   $('nav').style.top = tb + 'px';
   $('nav').style.width = nw + 'px';
   $('nav').style.height = (vh - tb) + 'px';
   var nb = $('navbg'); nb.style.width = nw + 'px'; nb.style.height = (993 * s) + 'px';
   var nodes = document.querySelectorAll('.node');
   for (var i = 0; i < nodes.length; i++) {
     nodes[i].style.top = ((80 + i * 58) * s) + 'px';
     nodes[i].style.height = (46 * s) + 'px';
     nodes[i].style.font = '600 ' + (20 * s) + 'px "Microsoft YaHei"';
   }
   var pg = $('page');
   pg.style.left = nw + 'px';
   pg.style.top = tb + 'px';
   pg.style.width = (vw - nw) + 'px';
   pg.style.height = (vh - tb) + 'px';
   document.documentElement.style.setProperty('--s', s);
 }
 window.addEventListener('resize', fit);
 window.addEventListener('orientationchange', fit);
 if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); }
 fit();
 document.querySelectorAll('.node').forEach(function(b){
   b.onclick = function(){
     document.querySelectorAll('.node').forEach(function(x){x.classList.remove('on');});
     b.classList.add('on');
     if (b.dataset.page) { document.getElementById('page').innerHTML = PAGE[b.dataset.page] || ''; }
   };
 });
